<style>
:root{

  --glass:rgba(255,255,255,.84); --blur:blur(20px) saturate(1.6); --tint:rgba(120,130,150,.12); --tint2:rgba(120,130,150,.25);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;

  --ease:cubic-bezier(.2,.8,.2,1); --cardH:280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
button,a{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
:focus:not(:focus-visible){outline:none}
body{font-family:Inter,system-ui,sans-serif;font-kerning:normal;color:var(--ink);-webkit-font-smoothing:antialiased;background:#eef0f2;line-height:1.4}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#map{position:fixed;inset:0;height:100lvh}
.statusfade{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 24px);background:linear-gradient(rgba(20,25,35,.38),rgba(20,25,35,0));pointer-events:none;z-index:3;display:none}
@media (display-mode: standalone){.statusfade{display:block}}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
/* top segmented */
.seg{position:fixed;top:var(--top);left:var(--s4);right:var(--s4);max-width:520px;margin:0 auto;height:44px;padding:var(--s1);border-radius:999px;box-shadow:0 4px 20px rgba(20,30,50,.12);display:flex;gap:2px;z-index:6}
.seg{position:fixed}
.seg .thumb{position:absolute;top:4px;left:0;height:36px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(20,30,50,.16);transition:transform .35s var(--ease),width .35s var(--ease);z-index:0}
.seg .thumb.noanim{transition:none}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;height:36px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:500;cursor:pointer;transition:font-weight .2s}
.seg button[aria-pressed="true"]{font-weight:600}
/* recenter */
.fab{position:fixed;right:var(--s4);bottom:calc(var(--bot) + var(--cardH) + var(--s3));width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;box-shadow:0 4px 16px rgba(20,30,50,.16);cursor:pointer;z-index:5;transition:bottom .38s var(--ease)}
.fab:active{transform:scale(.94)}
/* card */
.cardshadow{position:fixed;left:calc(var(--edge) + 6px);right:calc(var(--edge) + 6px);bottom:calc(var(--edge) + 6px);max-width:548px;margin:0 auto;height:calc(var(--cardH) - 12px);border-radius:var(--innerR);box-shadow:0 8px 32px rgba(20,30,50,.20);z-index:5;pointer-events:none;transition:height .38s var(--ease)}
.card{position:fixed;left:var(--edge);right:var(--edge);bottom:var(--edge);max-width:560px;margin:0 auto;height:var(--cardH);border-radius:var(--innerR);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);z-index:6;transition:height .38s var(--ease)}
.view{grid-area:1/1;align-self:start;min-width:0;width:100%;transition:opacity .28s ease-out,transform .38s var(--ease),visibility 0s linear .38s}
.view.off{opacity:0;visibility:hidden;pointer-events:none}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s ease-out .06s,transform .38s var(--ease),visibility 0s}
#dayv.off{transform:translateX(-24px)} #stepv.off{transform:translateX(24px)}
.dayin{padding:var(--s6) var(--s6) calc(var(--safeB) + 4px);display:flex;flex-direction:column;gap:var(--s4)}
.kick{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dayin h1{font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-0.02em;text-wrap:balance;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.stat:nth-child(3) b{font-size:20px;line-height:27px}
/* frise */
.frise{position:relative;height:80px;margin:0 -4px}
.frise .rail{position:absolute;left:22px;right:22px;top:21px;height:2px;border-radius:1px;opacity:.35}
.frise ol{list-style:none;display:flex;justify-content:space-between;position:relative}
.frise li{flex:0 0 44px;height:80px;position:relative}
.tap{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:80px;display:block;position:relative;border-radius:12px}
.tap:focus-visible{outline:2px solid var(--blue)}
.tap .dot{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;transition:transform .18s ease-out;font-variant-numeric:tabular-nums}
.tap:active .dot{transform:scale(.88)}
.tap .lab{position:absolute;top:42px;left:50%;transform:translateX(-50%);width:var(--lw,56px);text-align:center;font-size:11px;line-height:1.2;font-weight:500;hyphens:manual;letter-spacing:-0.01em}
/* step carousel */
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scroll-behavior:smooth;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;padding:var(--s3) var(--s6) calc(var(--safeB) + 8px);display:flex;flex-direction:column;gap:14px;min-width:0}
.bars-row{display:flex;align-items:center;gap:var(--s2);padding:22px var(--s6) 0 var(--s6)}
.bars{flex:1 1 auto;display:grid;gap:var(--s1)}
.bars i{height:4px;border-radius:2px;background:var(--tint2);transition:background-color .3s ease-out}
.x{flex:0 0 auto;width:44px;height:44px;margin:-8px -10px -8px 0;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.meta{display:flex;justify-content:space-between;gap:var(--s2);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.slide h2{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-0.02em;text-wrap:balance}
.slide .leg{font-size:15px;color:var(--muted);margin-top:var(--s1);font-variant-numeric:tabular-nums}
.slide p.desc{font-size:16px;line-height:1.5;text-wrap:pretty;max-width:65ch}
.go{min-height:56px;border-radius:16px;background:var(--blue);color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:600;transition:transform .15s ease-out}
.go:active{transform:scale(.98)}
.food{display:flex;gap:var(--s2)}
.food a{flex:1 1 0;min-width:0;min-height:44px;padding:0 var(--s3);border-radius:14px;background:var(--tint);color:var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:var(--s2);font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .15s ease-out}
.food a:active{transform:scale(.97)}
/* pins */
.pin{display:flex;align-items:center;gap:var(--s1);cursor:pointer}
.pin .c{width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font:600 12px/1 Inter,sans-serif;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.pin.sel .c{transform:scale(1.3)}
.pin .l{font:600 12px/1.2 Inter,sans-serif;color:var(--ink);background:rgba(255,255,255,.92);padding:2px 6px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* overlays */
.ov{position:fixed;inset:0;display:none;place-items:center;z-index:4;text-align:center;padding:var(--s6)}
.ov.show{display:grid}
#skel{background:linear-gradient(100deg,#eef0f2 30%,#f6f7f8 50%,#eef0f2 70%) 0 0/200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#skel .msg{font-size:14px;color:var(--muted);margin-bottom:30dvh}
.progress{width:160px;height:4px;border-radius:2px;background:var(--tint2);margin:var(--s2) auto 0;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s ease-out}
#err{background:#eef0f2}
#err p{font-size:14px;max-width:32ch;margin:0 auto var(--s3)}
#err>div{margin-bottom:30dvh}
#err button{min-height:44px;padding:0 var(--s4);border-radius:999px;border:0;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.maplibregl-ctrl-top-left{top:calc(var(--top) + 52px)!important}
.maplibregl-ctrl-attrib{font-size:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

  nav:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>',
  home:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>'
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'');
const dayStops=d=>STOPS.map((s,i)=>[s,i]).filter(([s])=>s.day===d);
const totals=d=>{const l=ROUTES[d].legs;return [l.reduce((a,x)=>a+x[0],0),l.reduce((a,x)=>a+x[1],0)];};
const legBefore=(d,k)=>{const o=d===0?0:1;const li=k-1+o;return li>=0?ROUTES[d].legs[li]:null;};
const fromName=(d,k)=>{ if(k>0){const p=dayStops(d)[k-1][0];return p.home?'le logement':(SHORT[p.name]||p.name);} return d===0?null:'le logement'; };
const numOf=i=>{const s=STOPS[i]; if(s.home) return null; let n=0; for(let j=0;j<=i;j++) if(STOPS[j].day===s.day&&!STOPS[j].home) n++; return n;};
const badge=i=>STOPS[i].home?ICON.home:numOf(i);
const waze=s=>s.addr?`https://waze.com/ul?q=${encodeURIComponent(s.addr)}&navigate=yes`:`https://waze.com/ul?ll=${s.lat},${s.lon}&navigate=yes`;
const gsearch=(q,s)=>`https://www.google.com/maps/search/${encodeURIComponent(q)}/@${s.lat},${s.lon},15z`;
const short=n=>SHORT[n]||n;
const HY={Coutances:'Cou\u00adtances',Regnéville:'Regné\u00adville',Granville:'Gran\u00adville',Gouville:'Gou\u00adville',Colleville:'Colle\u00adville',Deauville:'Deau\u00adville',Honfleur:'Hon\u00adfleur',Logement:'Loge\u00adment','Étretat':'Étre\u00adtat',Vannes:'Van\u00adnes'};
const hy=t=>t.split(' ').map(w=>HY[w]||w).join(' ');


/* continuous (iOS-style) rounded rect path */
function squirclePath(w,h,rt,rb){
  const K=[1.52866483,1.08849323,0.86840689,0.63149399,0.07491100,0.37282392,0.16905899];
  const lim=Math.min(w,h)/2/K[0]; rt=Math.min(rt,lim); rb=Math.min(rb,lim);
  const f=n=>Math.round(n*100)/100;
  const p=[];
  const corner=(cx,cy,sx,sy,r,first)=>{ // cx,cy = corner point; sx,sy = direction signs into the rect
    // horizontal edge -> vertical edge, going around
    const P=(a,b)=>f(cx+sx*a)+' '+f(cy+sy*b);
    return {h:(a,b)=>P(a*r,b*r)};
  };
  // start top edge after top-left corner
  const T=(x,y)=>f(x)+' '+f(y);
  p.push('M'+T(K[0]*rt,0));
  // top-right
  p.push('L'+T(w-K[0]*rt,0));
  p.push('C'+T(w-K[1]*rt,0)+' '+T(w-K[2]*rt,0)+' '+T(w-K[3]*rt,K[4]*rt));
  p.push('C'+T(w-K[5]*rt,K[6]*rt)+' '+T(w-K[6]*rt,K[5]*rt)+' '+T(w-K[4]*rt,K[3]*rt));
  p.push('C'+T(w,K[2]*rt)+' '+T(w,K[1]*rt)+' '+T(w,K[0]*rt));
  // bottom-right
  p.push('L'+T(w,h-K[0]*rb));
  p.push('C'+T(w,h-K[1]*rb)+' '+T(w,h-K[2]*rb)+' '+T(w-K[4]*rb,h-K[3]*rb));
  p.push('C'+T(w-K[6]*rb,h-K[5]*rb)+' '+T(w-K[5]*rb,h-K[6]*rb)+' '+T(w-K[3]*rb,h-K[4]*rb));
  p.push('C'+T(w-K[2]*rb,h)+' '+T(w-K[1]*rb,h)+' '+T(w-K[0]*rb,h));
  // bottom-left
  p.push('L'+T(K[0]*rb,h));
  p.push('C'+T(K[1]*rb,h)+' '+T(K[2]*rb,h)+' '+T(K[3]*rb,h-K[4]*rb));
  p.push('C'+T(K[5]*rb,h-K[6]*rb)+' '+T(K[6]*rb,h-K[5]*rb)+' '+T(K[4]*rb,h-K[3]*rb));
  p.push('C'+T(0,h-K[2]*rb)+' '+T(0,h-K[1]*rb)+' '+T(0,h-K[0]*rb));
  // top-left
  p.push('L'+T(0,K[0]*rt));
  p.push('C'+T(0,K[1]*rt)+' '+T(0,K[2]*rt)+' '+T(K[4]*rt,K[3]*rt));
  p.push('C'+T(K[6]*rt,K[5]*rt)+' '+T(K[5]*rt,K[6]*rt)+' '+T(K[3]*rt,K[4]*rt));
  p.push('C'+T(K[2]*rt,0)+' '+T(K[1]*rt,0)+' '+T(K[0]*rt,0)+'Z');
  return p.join(' ');
}
function screenRadius(){
  const w=Math.min(screen.width,screen.height), h=Math.max(screen.width,screen.height);
  const map={'402x874':62,'440x956':62,'393x852':55,'430x932':55,'390x844':47.33,'428x926':53.33,'375x812':39,'414x896':41.5,'360x780':44};
  return map[w+'x'+h] || 55;
}
const EDGE=8, R_SCREEN=screenRadius(), R_BOTTOM=Math.max(16,R_SCREEN-EDGE), R_TOP=R_BOTTOM;
function clipCard(){
  const c=$('card'); const w=c.offsetWidth, h=c.offsetHeight; if(!w||!h) return;
  const atBottom = Math.abs(window.innerHeight - c.getBoundingClientRect().bottom - EDGE) < 2 && Math.abs(c.getBoundingClientRect().left - EDGE) < 2;
  const d=squirclePath(w,h,R_TOP, atBottom?R_BOTTOM:R_TOP);
  c.style.clipPath=`path('${d}')`; c.style.webkitClipPath=`path('${d}')`;
}

/* ---------- views ---------- */
function frise(items,color){
  const n=items.length;
  return `<div class="frise"><span class="rail" style="background:${color}"></span><ol>${items.map((it,k)=>{
    const pos=k===0?'first':(k===n-1?'last':'mid');
    return `<li><button class="tap" data-k="${k}" aria-label="${esc(it.aria)}"><span class="dot" style="background:${it.color||color}">${it.badge}</span><span class="lab">${esc(it.label)}</span></button></li>`;}).join('')}</ol></div>`;
}
let segBuilt=false;
function renderSeg(){
  const seg=$('seg');
  if(!segBuilt){
    seg.innerHTML='<span class="thumb noanim" aria-hidden="true"></span>'+[{id:-1,s:'Tout'}].concat(DAYS.map(d=>({id:d.id,s:d.short.split(' ')[0]}))).map(d=>`<button data-d="${d.id}" aria-label="${d.id===-1?'Tout le roadtrip':DAYS[d.id].name}">${d.s}</button>`).join('');
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>setDay(+b.dataset.d));
    segBuilt=true;
  }
  seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.d===curDay));
  moveThumb();
}
function moveThumb(){
  const seg=$('seg'), th=seg.querySelector('.thumb'), b=seg.querySelector(`button[data-d="${curDay}"]`); if(!b) return;
  th.style.width=b.offsetWidth+'px'; th.style.transform=`translateX(${b.offsetLeft}px)`;
  if(th.classList.contains('noanim')) requestAnimationFrame(()=>requestAnimationFrame(()=>th.classList.remove('noanim')));
}
function renderDay(){
  const v=$('dayv');
  if(curDay===-1){
    let m=0,k=0; DAYS.forEach(d=>{const t=totals(d.id);m+=t[0];k+=t[1];});
    v.innerHTML=`<div class="dayin"><div><div class="kick">12 au 16 novembre</div><h1>Roadtrip en Normandie</h1></div>
      <div class="stats"><div class="stat"><b>${fmt(m)}</b><span>de route</span></div><div class="stat"><b>${k} km</b><span>au total</span></div><div class="stat"><b>4 nuits</b><span>3 logements</span></div></div>
      ${frise(DAYS.map(d=>({label:d.short,aria:d.name+' : '+d.title,badge:d.short.split(' ')[1],color:d.css})),'var(--muted)')}</div>`;
    v.querySelectorAll('.tap').forEach(b=>b.onclick=()=>setDay(+b.dataset.k));
    return;
  }
  const d=DAYS[curDay],[m,k]=totals(curDay),list=dayStops(curDay);
  v.innerHTML=`<div class="dayin"><div><div class="kick">${d.name}</div><h1>${esc(d.title)}</h1></div>
    <div class="stats"><div class="stat"><b>${fmt(m)}</b><span>de route</span></div><div class="stat"><b>${k} km</b><span>au total</span></div><div class="stat"><b>${esc(NIGHT[curDay])}</b><span>${NIGHTL[curDay]}</span></div></div>
    ${frise(list.map(([s,i])=>({label:hy(short(s.name)),aria:(s.home?'Logement : ':'Étape '+numOf(i)+' : ')+s.name,badge:badge(i)})),d.css)}</div>`;
  v.querySelectorAll('.tap').forEach(b=>b.onclick=()=>openStep(+b.dataset.k));
}
function renderSteps(){
  const v=$('stepv'); if(curDay===-1){v.innerHTML='';return;}
  const d=DAYS[curDay], list=dayStops(curDay), n=list.length;
  v.innerHTML=`<div class="bars-row"><div class="bars" id="bars" style="grid-template-columns:repeat(${n},minmax(0,1fr))" aria-hidden="true">${list.map(()=>'<i></i>').join('')}</div><button class="x" id="closeStep" aria-label="Revenir à la journée">${ICON.x}</button></div>
  <div class="car" id="car">${list.map(([s,i],k)=>{
    const lg=legBefore(curDay,k), from=fromName(curDay,k);
    return `<article class="slide" aria-label="${esc(s.name)}">
      <div class="meta"><span>${d.name} · ${esc(s.time)}</span><span>${s.home?'Logement':'Étape '+(k+1)+' sur '+n}</span></div>
      <div><h2>${esc(s.name)}</h2>${lg&&from?`<div class="leg">${fmt(lg[0])} depuis ${esc(from)} · ${lg[1]} km</div>`:''}</div>
      <p class="desc">${esc(s.desc)}</p>
      <a class="go" href="${waze(s)}" target="_blank" rel="noopener">${ICON.nav}Y aller avec Waze</a>
      <div class="food">${s.food.slice(0,3).map(f=>`<a href="${gsearch(f[1],s)}" target="_blank" rel="noopener">${esc(f[0])}</a>`).join('')}</div>
    </article>`;}).join('')}</div>`;
  $('closeStep').onclick=closeStep;
  const car=$('car'); let t=null;
  car.addEventListener('scroll',()=>{ const k=Math.round(car.scrollLeft/car.clientWidth); paintBars(k); clearTimeout(t); t=setTimeout(()=>{ if(k!==cur){ cur=k; focusStop(); } },140); },{passive:true});
}
function paintBars(k){ const b=$('bars'); if(!b) return; const c=DAYS[curDay].css; [...b.children].forEach((el,j)=>el.style.background=j<=k?c:''); }
function showView(step,after){
  $('dayv').className='view '+(step?'off':'on'); $('stepv').className='view '+(step?'on':'off');
  $('dayv').setAttribute('aria-hidden',step); $('stepv').setAttribute('aria-hidden',!step);
  const fr=$('dayv').querySelector('.frise'); if(fr){ const n=fr.querySelectorAll('li').length; fr.style.setProperty('--lw',Math.min(62,Math.max(44,(fr.clientWidth-44)/Math.max(1,n-1)-4))+'px'); }
  requestAnimationFrame(()=>{ sizeCard(); after&&after(); });
}
function sizeCard(){
  const el=sel===null?$('dayv'):$('stepv'); const h=el.scrollHeight;
  document.documentElement.style.setProperty('--cardH',h+'px');
}
function pad(h){ h=h||parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cardH'))||280; const top=$('seg').getBoundingClientRect().bottom+12; return {top, left:24, right:72, bottom:h+parseFloat(getComputedStyle($('card')).bottom)+24}; }

function setDay(id){
  curDay=id; sel=null; cur=0;
  renderSeg(); renderDay(); renderSteps(); updateLayers(); showView(false,fitDay);
}
function openStep(k){
  sel=k; cur=k;
  paintBars(k);
  showView(true,()=>{ const car=$('car'); if(car){ car.style.scrollBehavior='auto'; car.scrollLeft=k*car.clientWidth; car.style.scrollBehavior=''; } focusStop(); });
}
function closeStep(){ sel=null; drawPins(); showView(false,fitDay); }
function focusStop(){
  const [s,i]=dayStops(curDay)[cur]; drawPins(i);
  if(map){ const p=pad(); map.flyTo({center:[s.lon,s.lat],zoom:s.name==='Vannes'?10:13,offset:[(p.left-p.right)/2,(p.top-p.bottom)/2],duration:DUR}); }
}

/* ---------- map ---------- */
function routeGeo(){ return {type:'FeatureCollection',features:DAYS.map(d=>({type:'Feature',properties:{color:d.hex,on:(curDay===-1||curDay===d.id)?1:0},geometry:{type:'LineString',coordinates:ROUTES[d.id].coords}})).sort((a,b)=>a.properties.on-b.properties.on)}; }
function boundsFor(day){ const b=new maplibregl.LngLatBounds(); if(day===-1) STOPS.filter(s=>s.name!=='Vannes').forEach(s=>b.extend([s.lon,s.lat])); else ROUTES[day].coords.forEach(c=>b.extend(c)); return b; }
function fitDay(){ if(map) map.fitBounds(boundsFor(curDay),{padding:pad(),maxZoom:12.5,duration:DUR}); }
function drawPins(selI){
  if(!map) return; markers.forEach(m=>m.remove()); markers=[];
  const seen=new Set();
  STOPS.forEach((s,i)=>{
    if(curDay!==-1&&s.day!==curDay) return;
    if(curDay===-1){ if(seen.has(s.name)) return; seen.add(s.name); }
    const d=DAYS[s.day]; const n=s.home?ICON.home:(curDay===-1?'':numOf(i));
    const label=(curDay!==-1&&!s.home)||['Granville','Honfleur','Étretat','Coutances','Deauville','Pointe du Hoc','Vannes'].includes(s.name);
    const el=document.createElement('div'); el.className='pin'+(selI===i?' sel':'');
    el.innerHTML=`<span class="c" style="background:${d.hex}">${n}</span>${label?`<span class="l">${esc(short(s.name))}</span>`:''}`;
    el.addEventListener('click',e=>{e.stopPropagation(); if(curDay!==s.day) setDay(s.day); const k=dayStops(s.day).findIndex(([,j])=>j===i); openStep(k);});
    markers.push(new maplibregl.Marker({element:el,anchor:'left',offset:[-14,0]}).setLngLat([s.lon,s.lat]).addTo(map));
    el.setAttribute('aria-label',s.name);
  });
}
function updateLayers(){ if(map&&map.getSource('routes')) map.getSource('routes').setData(routeGeo()); drawPins(); }
async function fetchText(url,onBytes){ const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); if(!r.body) return await r.text(); const rd=r.body.getReader(),p=[]; for(;;){const {done,value}=await rd.read(); if(done) break; p.push(value); onBytes(value.length);} return await new Blob(p).text(); }
function b64(b){ if(Uint8Array.fromBase64) return Uint8Array.fromBase64(b).buffer; const s=atob(b),u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }
let FONTS=null, protoReady=false;
async function initMap(){
  const skel=$('skel'), err=$('err'); err.classList.remove('show');
  const t=setTimeout(()=>skel.classList.add('show'),300);
  try{
    const total=23320314; let got=0; const bar=()=>$('bar').style.width=Math.min(100,Math.round(got/total*100))+'%';
    const res=await Promise.all([fetch(BASE+'fonts.json').then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json();}),
      ...Array.from({length:3},(_,i)=>fetchText(BASE+'map-'+i+'.json',n=>{got+=n;bar();}))]);
    FONTS=res[0];
    if(!protoReady){
      const file=new File([b64(res.slice(1).map(x=>JSON.parse(x)).join(''))],'normandie.pmtiles');
      const protocol=new pmtiles.Protocol(); maplibregl.addProtocol('pmtiles',protocol.tile); protocol.add(new pmtiles.PMTiles(new pmtiles.FileSource(file)));
      maplibregl.addProtocol('glyph',async(p)=>{const m=p.url.match(/^glyph:\/\/([^/]+)\/(.+)$/);const fs=decodeURIComponent(m[1]).split(',')[0].trim().toLowerCase().replace(/ /g,'-');const v=FONTS[fs+'/'+m[2]]||FONTS['noto-sans-regular/'+m[2]];return {data:v?b64(v):new ArrayBuffer(0)};});
      protoReady=true;
    }
    map=new maplibregl.Map({container:'map',minZoom:6,maxZoom:16,maxBounds:[[-5.5,45.5],[2.8,51.2]],attributionControl:false,bounds:boundsFor(curDay),fitBoundsOptions:{padding:pad()},
      style:{version:8,glyphs:'glyph://{fontstack}/{range}',sprite:BASE+'sprites/light',sources:{protomaps:{type:'vector',url:'pmtiles://normandie.pmtiles',attribution:'© OpenStreetMap'}},
        layers:basemaps.layers('protomaps',Object.assign({},basemaps.namedFlavor('light'),FLAVOR),{lang:'fr'})}});
    map.addControl(new maplibregl.AttributionControl({compact:true}),'top-left');
    map.on('load',()=>{
      clearTimeout(t); skel.classList.remove('show');
      map.addSource('routes',{type:'geojson',data:routeGeo()});
      map.addLayer({id:'route-casing',type:'line',source:'routes',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-width':['case',['==',['get','on'],1],8,4],'line-opacity':['case',['==',['get','on'],1],0.95,0.3]}});
      map.addLayer({id:'route',type:'line',source:'routes',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','color'],'line-width':['case',['==',['get','on'],1],4.5,2.5],'line-opacity':['case',['==',['get','on'],1],1,0.3]}});
      drawPins(sel===null?undefined:dayStops(curDay)[cur][1]);
    });
  }catch(e){ clearTimeout(t); skel.classList.remove('show'); err.classList.add('show'); }
}
$('retry').onclick=()=>initMap();
$('recenter').onclick=()=>{ if(sel===null) fitDay(); else focusStop(); };
window.addEventListener('resize',()=>requestAnimationFrame(()=>{ const th=$('seg').querySelector('.thumb'); th&&th.classList.add('noanim'); moveThumb(); sizeCard(); if(sel===null) fitDay(); }));
document.documentElement.style.setProperty('--innerR',R_BOTTOM+'px');
new ResizeObserver(clipCard).observe($('card')); window.addEventListener('resize',clipCard);
setDay(-1); initMap();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(e=>console.error('[pepettes] sw',e)); }); }
</script>
